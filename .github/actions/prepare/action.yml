name: Prepare

description: Checkout and install dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 24

    - uses: pnpm/action-setup@v078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1

    - name: Install Dependencies
      run: pnpm i --frozen-lockfile
      shell: bash
