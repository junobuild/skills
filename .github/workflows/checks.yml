name: Checks

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Format
        run: pnpm fmt:check

  may-merge:
    needs: ["format"]
    runs-on: ubuntu-latest
    steps:
      - name: Cleared for merging
        run: echo OK
